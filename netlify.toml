# ---------------------------------------------------------------------------
# Netlify — deploys apps/web only.
#
# The repo is a pnpm workspace with two apps. `apps/worker` is a long-running
# croner scheduler and cannot live on Netlify; it is deployed separately (or
# run locally). Netlify serves the READ side: apps/web.
#
# Base stays at the repo root so pnpm can link the workspace packages the web
# app depends on (@equitywise/core, /db, /shared, ...). The Next runtime finds the
# app from `publish`, so no "package directory" needs setting in the UI — if one
# is already set there, clear it, because settings here win.
# ---------------------------------------------------------------------------

[build]
  # Builds @equitywise/web's workspace dependencies first, then `next build`.
  command = "pnpm --filter @equitywise/web build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22"

  # Netlify fails a build when the VALUE of any environment variable appears in
  # the deploy output. The Clerk publishable key does appear there: it is baked
  # into the prerendered HTML and RSC payloads of the static routes (/, /404,
  # /design-system) and into the client chunk that hydrates them. That is by
  # design — the publishable key is public — so the scanner is told to ignore
  # this one key, and this one only.
  #
  # CLERK_SECRET_KEY, DATABASE_URL and every FYERS_* value stay in scope. If the
  # scanner ever flags one of those, it is a real leak: fix the leak, never add
  # the key here.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"

[[plugins]]
  package = "@netlify/plugin-nextjs"
