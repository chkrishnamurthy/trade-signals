name: Deploy to VPS

# Fires whenever main changes (i.e. when you merge a branch into main),
# and can also be run by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; let an in-flight one finish.
concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The VPS is locked so this key can ONLY run /opt/equitywise/scripts/deploy.sh
          # (a "forced command" in authorized_keys), so the word 'deploy' below is just a
          # placeholder — the server runs the real deploy script and streams its output here.
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=20 \
              krishna@187.127.171.118 deploy
