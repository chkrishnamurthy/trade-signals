name: CI

# Checks for the web app and the Android app. Validates pull requests targeting main and
# validates main again before deploying the exact revision. Plain pushes to feature
# branches with no PR open run nothing.
#
# `checks`   — lint, typecheck, production/Storybook builds, and browser smoke.
# `db-tests` — the full Vitest suite against a real, ephemeral Postgres 17 +
#              TimescaleDB service (the same stack the VPS runs). This is what
#              exercises the DB-enforced invariants; TEST_DATABASE_URL is set, so
#              those suites are REQUIRED here and cannot silently skip.
# `deploy`   — runs only after both validation jobs pass, then verifies production.
# Lint runs on `apps` and `packages` (`pnpm lint:app`). The root `pnpm lint` also covers
# `tracker/`, a separate dev tool with its own older Biome errors; those are not a gate.
# The Storybook interaction/a11y test run is not wired yet (see
# docs/design-system/contributing.md — blocked upstream).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # PR checks may be replaced by a newer revision. Never interrupt a production
  # deployment that has already started for main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The workspace packages resolve through their compiled dist/*.d.ts
      # (see each package's "exports"), so they must be built before the web
      # app can typecheck them. Same selector `pnpm --filter web build` uses.
      - name: Build workspace dependencies
        run: pnpm --filter "@equitywise/web^..." build

      - name: Lint (apps, packages)
        run: pnpm lint:app

      - name: Typecheck
        run: pnpm typecheck

      - name: Production build
        run: pnpm build

      - name: Build Storybook
        run: pnpm --filter @equitywise/web build-storybook

      - name: Install browser for release smoke
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser release smoke
        run: pnpm test:e2e

  mobile:
    # The Android app (apps/mobile) and the client-safe packages it uses. Lint is
    # scoped to these paths (docs/mobile/01-discovery.md R9) so the repo's
    # pre-existing Biome errors elsewhere cannot hide a new one here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm --filter "@equitywise/mobile^..." build

      - name: Typecheck (mobile)
        run: pnpm --filter @equitywise/mobile typecheck

      - name: Lint (mobile + client packages)
        run: npx biome check apps/mobile packages/api-client packages/api-contracts packages/design-tokens

      - name: Unit tests (mobile + client packages)
        run: pnpm vitest run apps/mobile packages/api-client packages/api-contracts packages/design-tokens packages/shared

  db-tests:
    runs-on: ubuntu-24.04
    services:
      # Matches production and docker-compose.test.yml: PG 17 + TimescaleDB, so
      # the migrations' hypertables and CREATE EXTENSION run for real.
      postgres:
        image: timescale/timescaledb:2.17.2-pg17
        env:
          POSTGRES_USER: equitywise
          POSTGRES_PASSWORD: equitywise
          POSTGRES_DB: nse_signals_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U equitywise -d nse_signals_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Present, so the DB-backed suites are required and cannot silently skip.
      TEST_DATABASE_URL: postgresql://equitywise:equitywise@localhost:5433/nse_signals_test
      AUTH_TEST_DB: postgresql://equitywise:equitywise@localhost:5433/nse_signals_test
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cross-package imports resolve through each package's dist/ (no source
      # aliases in vitest.config.ts), so the tree must be built before testing.
      - name: Build workspace packages
        run: pnpm --filter "./packages/**" build

      # The Vitest global setup migrates the database on the first run; this
      # keeps that cost out of the suite's own timing and fails fast on a bad
      # migration.
      - name: Migrate test database
        run: pnpm --filter @equitywise/db exec drizzle-kit migrate
        env:
          DATABASE_URL_DIRECT: ${{ env.TEST_DATABASE_URL }}

      - name: Test
        run: pnpm test

  deploy:
    # A production deployment is now part of the same workflow and cannot begin
    # until both the application checks and real-Postgres suite pass.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [checks, db-tests]
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s' "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=20 \
              krishna@187.127.171.118 "deploy ${GITHUB_SHA}"

      - name: Post-deploy smoke
        run: bash scripts/post-deploy-smoke.sh https://equitywise.io
