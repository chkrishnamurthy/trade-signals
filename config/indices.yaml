# Index constituents.
#
# Versioned config, not a database table (CLAUDE.md: "config is versioned YAML").
# `symbol` is our internal symbol; the Fyers symbol is derived by
# toFyersSymbol(symbol, kind), so `NSE:` prefixes and `-EQ` suffixes never
# appear here.
#
# Adding NIFTY100 / BANKNIFTY / a personal watchlist means adding a block here
# and nothing else — the API route reads whatever this file defines.

# Index instruments shown in the dashboard header. Fyers symbol is derived as
# NSE:<symbol>-INDEX.
headlineIndices:
  - { symbol: NIFTY50,   name: NIFTY 50 }
  - { symbol: NIFTYBANK, name: BANK NIFTY }
  - { symbol: FINNIFTY,  name: FIN NIFTY }
  - { symbol: INDIAVIX,  name: INDIA VIX, kind: volatility }

