<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>You're offline · EquityWise</title>
<!--
  Served by the service worker when a page cannot load for lack of network
  (docs/planning/pwa-plan.md §3.5). Static on purpose: no data, no session,
  no Next chunks, so nothing on it can be stale or private.
-->
<style>
  :root { --bg: #edf0f3; --surface: #ffffff; --fg: #1b2129; --muted: #5b6573; --primary: #00905e; --primary-fg: #ffffff; --border: #d7dde4; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #05070c; --surface: #171c22; --fg: #e8ecf1; --muted: #9aa5b3; --primary: #2fb582; --primary-fg: #04140d; --border: #2b333d; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.55 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; place-items: center;
    padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  }
  main { max-width: 26rem; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px 24px; display: flex; flex-direction: column; gap: 14px; }
  img { width: 48px; height: 48px; }
  h1 { margin: 0; font-size: 1.35rem; letter-spacing: -0.01em; }
  p { margin: 0; color: var(--muted); }
  button { align-self: flex-start; font: inherit; font-weight: 600; padding: 10px 18px; min-height: 44px; border-radius: 8px; border: 0; background: var(--primary); color: var(--primary-fg); cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
  small { color: var(--muted); font-size: 0.8rem; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>Prices, watchlists and your portfolio need a connection. Nothing is shown here so that nothing out of date is shown.</p>
  <button type="button" id="retry">Try again</button>
  <small id="status" role="status">This page reloads by itself when you are back online.</small>
</main>
<script>
  (() => {
    const retry = () => window.location.reload();
    document.getElementById('retry').addEventListener('click', retry);
    window.addEventListener('online', retry);
  })();
</script>
</body>
</html>
